name: Build, Sign Firefox Extension & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing/new release tag to attach assets to (e.g. v1.0.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: |
          node --test nikke-calc-firefox-ext/tests/*.test.mjs nikke-calc-edge-ext/tests/*.test.mjs

      - name: Package Edge extension
        run: |
          node nikke-calc-edge-ext/scripts/package-ext.mjs

      - name: Stage clean Firefox runtime files
        run: |
          node -e '
            import("./nikke-calc-firefox-ext/scripts/package-ext.mjs").then(async ({ RUNTIME_FILES }) => {
              const fs = await import("node:fs");
              const path = await import("node:path");
              const srcRoot = path.resolve("nikke-calc-firefox-ext");
              const dstRoot = path.resolve("build/firefox-src");
              fs.rmSync(dstRoot, { recursive: true, force: true });
              for (const rel of RUNTIME_FILES) {
                const src = path.join(srcRoot, ...rel.split("/"));
                const dst = path.join(dstRoot, ...rel.split("/"));
                fs.mkdirSync(path.dirname(dst), { recursive: true });
                fs.copyFileSync(src, dst);
              }
              console.log(`Staged ${RUNTIME_FILES.length} Firefox runtime files to ${dstRoot}`);
            });
          '

      - name: Sign Firefox extension via AMO (web-ext sign)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets."
            exit 1
          fi
          mkdir -p build/firefox-signed
          npx --yes web-ext@8 sign \
            --source-dir build/firefox-src \
            --artifacts-dir build/firefox-signed \
            --channel=unlisted

      - name: Collect release assets
        run: |
          mkdir -p build/release-assets
          XPI_FILE=$(find build/firefox-signed -maxdepth 1 -name "*.xpi" | head -n 1)
          if [ -z "$XPI_FILE" ]; then
            echo "::error::No signed .xpi produced by web-ext sign."
            exit 1
          fi
          cp "$XPI_FILE" build/release-assets/nikke-calc-firefox-ext-signed.xpi
          cp nikke-calc-edge-ext/dist/nikke-calc-edge-ext.zip build/release-assets/nikke-calc-edge-ext.zip
          ls -lh build/release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nikke-calc-extensions
          path: build/release-assets/*

      - name: Publish or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/release-assets/nikke-calc-firefox-ext-signed.xpi \
              build/release-assets/nikke-calc-edge-ext.zip \
              --clobber
          else
            gh release create "$TAG" \
              build/release-assets/nikke-calc-firefox-ext-signed.xpi \
              build/release-assets/nikke-calc-edge-ext.zip \
              --title "$TAG" \
              --generate-notes
          fi
